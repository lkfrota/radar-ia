name: radar-diario

on:
  schedule:
    - cron: "17 9 * * *"   # 9:17 UTC = 6:17 em Brasília; o GitHub costuma atrasar, e minuto redondo é horário de pico
  workflow_dispatch:

concurrency: radar

permissions:
  contents: write
  pages: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python -u -m src.main
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit
        run: |
          git config user.name "radar-ia"
          git config user.email "radar-ia@users.noreply.github.com"
          git add -A docs estado feedback
          git diff --cached --quiet || (git commit -m "radar: rodada $(date -u +%F)" && git pull --rebase && git push)
      - name: Conferir publicação do Pages
        # O build do Pages já falhou sozinho uma vez (2026-11-04) sem a rodada perceber. Espera o build do
        # commit atual, refaz até 3 vezes se der erro e, se persistir, falha o job (o GitHub avisa por e-mail).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          for tentativa in 1 2 3; do
            for i in $(seq 1 60); do   # até 10 min por tentativa
              leitura=$(gh api repos/${{ github.repository }}/pages/builds/latest --jq '[.commit,.status]|@tsv')
              commit=${leitura%%$'\t'*}; status=${leitura##*$'\t'}
              if [ "$commit" = "$sha" ] && [ "$status" = built ]; then echo "Pages publicado ($sha)"; exit 0; fi
              if [ "$commit" = "$sha" ] && [ "$status" = errored ]; then break; fi
              sleep 10
            done
            echo "Build do Pages falhou ou não apareceu (tentativa $tentativa); refazendo"
            gh api -X POST repos/${{ github.repository }}/pages/builds
            sleep 20
          done
          echo "::error::Pages não publicou $sha depois de 3 tentativas"; exit 1
