<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block titulo %}Radar de IA{% endblock %}</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1e2328; --mut:#6b7280; --card:#fff; --linha:#e6e3da; --ac:#b45309; --ok:#15803d; --ruim:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181b; --fg:#e8e6e1; --mut:#9aa0a8; --card:#1e2125; --linha:#30343a; --ac:#f59e0b; --ok:#4ade80; --ruim:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.65 Georgia, "Times New Roman", serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }
  header h1 { font-size: 1.7rem; margin: 0; }
  header p, .meta, nav a { font: 14px/1.4 system-ui, sans-serif; color: var(--mut); }
  nav { margin: 6px 0 22px; } nav a { margin-right: 14px; color: var(--ac); }
  article { background: var(--card); border: 1px solid var(--linha); border-radius: 10px; padding: 18px 20px; margin: 16px 0; }
  article.lido { opacity: .45; }
  article h2 { font-size: 1.2rem; margin: 6px 0 8px; line-height: 1.3; }
  article h2 a { color: inherit; text-decoration: none; } article h2 a:hover { text-decoration: underline; }
  article p { margin: 0 0 12px; }
  .tag { font: 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--ac); }
  .porque { font-size: 15px; color: var(--mut); border-left: 3px solid var(--ac); padding-left: 10px; margin-top: 12px; }
  .acoes { display:flex; gap: 10px; align-items:center; margin-top: 14px; font: 14px system-ui, sans-serif; }
  button { font: inherit; background: none; border: 1px solid var(--linha); color: var(--fg); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  button.on.like { border-color: var(--ok); color: var(--ok); } button.on.dislike { border-color: var(--ruim); color: var(--ruim); }
  label { cursor:pointer; margin-left:auto; }
  .aviso { font: 14px system-ui, sans-serif; background: var(--card); border: 1px dashed var(--linha); padding: 10px 14px; border-radius: 8px; }
  input[type=text], input[type=password], textarea, select { font: 15px system-ui, sans-serif; background: var(--card); color: var(--fg); border: 1px solid var(--linha); border-radius: 6px; padding: 6px 8px; }
  li.linha { display:flex; gap:8px; align-items:center; margin: 6px 0; font: 15px system-ui, sans-serif; }
  li.linha span { flex:1; } ul.lista { list-style:none; padding:0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Radar de IA</h1>
    <nav><a href="index.html">Hoje</a><a href="config.html">Configurar</a></nav>
  </header>
  {% block conteudo %}{% endblock %}
</main>
<script src="app.js"></script>
</body>
</html>
